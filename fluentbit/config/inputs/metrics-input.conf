[INPUT]
    Name   mem
    Tag    metric_memory
    Interval_Sec 60  # Collect metrics every 60 seconds (1 minute)

[INPUT]
    Name cpu
    Tag    metric_cpu
    Interval_Sec 60  # Collect metrics every 60 seconds (1 minute)

# Remove unnecessary fields to reduce the number of metrics seen by AWS CloudWatch to reduce the cost of monitoring.
[FILTER]
    Name record_modifier
    Match metric_memory
    Remove_key Mem.total
    Remove_key Mem.used
    Remove_key Swap.total
    Remove_key Swap.used
    Remove_key Swap.free

# Remove unnecessary fields to reduce the number of metrics seen by AWS CloudWatch to reduce the cost of monitoring.
[FILTER]
    Name record_modifier
    Match metric_cpu
    Remove_key user_p
    Remove_key system_p

[FILTER]
    Name Lua
    Match metric_*
    call append_tag
    code function append_tag(tag, timestamp, record) new_record = record new_record["tag"] = tag return 2, timestamp, new_record end
